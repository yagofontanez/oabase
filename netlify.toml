# ============================================================================
# Netlify.
#
# O deploy do Next é feito pelo runtime oficial da Netlify, que é detectado
# sozinho — não há plugin a declarar aqui. O que este arquivo existe para
# fixar é o resto:
#
# 1. o diretório das funções, porque a função agendada não é descoberta fora
#    do caminho padrão;
# 2. o comando de build com pnpm, que é o gerenciador do projeto
#    (packageManager em package.json);
# 3. o cabeçalho que mantém `/app` e `/api` fora dos índices de busca.
#
# O agendamento em si mora no próprio arquivo da função
# (netlify/functions/emails-diarios.mts), e não aqui: é assim que a Netlify
# lê `export const config = { schedule }`.
# ============================================================================

[build]
  command = "pnpm build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  # `.mts` precisa do bundler moderno; o padrão antigo não resolve ESM.
  node_bundler = "esbuild"

# ----------------------------------------------------------------------------
# A fronteira aberto/pago é aplicada em três lugares de propósito: `robots` na
# rota, `Disallow` em robots.ts e o cabeçalho aqui. Depender de um mecanismo
# só é como o produto pago vaza para o índice.
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# `/sitemap.xml` é o endereço que todo mundo tenta primeiro — o que se digita
# no Search Console, o que a ferramenta de auditoria busca, o que o parceiro
# pede por e-mail. O Next não pode servi-lo: com `generateSitemaps` ele
# reserva esse caminho para a convenção de metadata e derruba o build se
# houver uma rota ali. A reescrita resolve sem tocar no roteamento — status
# 200, e não 301, para que o endereço na barra continue sendo o esperado.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200
  # `force` não é zelo: sem ele a regra não vale nada aqui. O runtime do Next
  # reivindica `/sitemap.xml` (é caminho da convenção de metadata, mesmo sem
  # arquivo servindo) e responde 404 antes de a reescrita ser consultada.
  # Verificado em produção: sem `force`, 404; com `force`, o índice.
  force = true

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
