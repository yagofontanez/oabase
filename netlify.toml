# ============================================================================
# Netlify.
#
# O deploy do Next é feito pelo runtime oficial da Netlify, que é detectado
# sozinho — não há plugin a declarar aqui. O que este arquivo existe para
# fixar é o resto:
#
# 1. o diretório das funções, porque a função agendada não é descoberta fora
#    do caminho padrão;
# 2. o comando de build com pnpm, que é o gerenciador do projeto
#    (packageManager em package.json);
# 3. o cabeçalho que mantém `/app` e `/api` fora dos índices de busca.
#
# O agendamento em si mora no próprio arquivo da função
# (netlify/functions/emails-diarios.mts), e não aqui: é assim que a Netlify
# lê `export const config = { schedule }`.
# ============================================================================

[build]
  command = "pnpm build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  # `.mts` precisa do bundler moderno; o padrão antigo não resolve ESM.
  node_bundler = "esbuild"

# ----------------------------------------------------------------------------
# A fronteira aberto/pago é aplicada em três lugares de propósito: `robots` na
# rota, `Disallow` em robots.ts e o cabeçalho aqui. Depender de um mecanismo
# só é como o produto pago vaza para o índice.
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# NÃO tente servir `/sitemap.xml` daqui. Já foi tentado, das duas formas:
# reescrita simples e com `force = true`. As duas resultam em 404 em
# produção — o runtime do Next reivindica esse caminho porque ele pertence à
# convenção de metadata, e a regra da Netlify nem chega a ser consultada.
# Uma rota do Next ali também não resolve: o build cai com "Conflicting route
# and metadata at /sitemap.xml".
#
# O endereço estável do índice é `/sitemap-index.xml`, e é ele que o
# robots.txt anuncia junto com as partições.
# ----------------------------------------------------------------------------

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/compartilhar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
